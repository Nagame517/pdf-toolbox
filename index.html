<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c52e48"><title>PDF TOOLBOX</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{font-family:system-ui,sans-serif;background:#f5f6fa;color:#202637}*{box-sizing:border-box}body{margin:0}header{background:white;padding:18px;border-bottom:1px solid #ddd}h1{margin:0;font-size:22px;color:#c52e48}main{max-width:1050px;margin:auto;padding:16px}.upload{display:block;border:2px dashed #aab2c3;background:white;border-radius:16px;text-align:center;padding:30px;cursor:pointer}.upload input{display:none}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{border:1px solid #d6d9e2;background:white;border-radius:9px;padding:10px 13px;cursor:pointer}button.primary{background:#c52e48;color:white;border-color:#c52e48}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.page{background:white;padding:12px;border:2px solid transparent;border-radius:12px;box-shadow:0 2px 9px #0001}.page.selected{border-color:#c52e48;background:#fff4f6}.page canvas{width:100%;height:170px;object-fit:contain;background:#eef0f4}.page small{display:block;overflow-wrap:anywhere;color:#596174}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.actions button{padding:7px 9px}.status{margin:12px 0;color:#596174}label.pick{display:flex;align-items:center;gap:6px;margin:8px 0}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page canvas{height:135px}.tools button{flex:1}}
 .range-tools{background:white;padding:14px;border-radius:12px;margin-bottom:14px}.range-tools label{font-weight:600;display:block;margin-bottom:8px}.range-line{display:flex;flex-wrap:wrap;gap:8px}.range-line input{flex:1;min-width:145px;padding:10px;border:1px solid #c7cad2;border-radius:8px}.range-line button{flex:1;min-width:120px}</style></head><body><header><h1>PDF TOOLBOX</h1></header><main><p>PDFを端末内で結合・分割・並べ替え・回転・削除できます。</p><label class="upload"><strong>＋ PDFファイルを追加</strong><p>タップして選択（複数可）</p><input id="files" type="file" accept=".pdf,application/pdf" multiple></label><div class="tools"><button id="all">全選択／解除</button><button id="rotate">選択を90°回転</button><button id="remove">選択を削除</button><button id="extract">選択ページを保存</button><button id="clear">クリア</button><button class="primary" id="save">すべて保存（結合）</button></div><section class="range-tools"><label for="range">ページ範囲（例：1-3,5,8-10）</label><div class="range-line"><input id="range" type="text" inputmode="text" placeholder="例：1-3,5"><button id="rangeSelect">範囲を選択</button><button id="rangeSave">範囲をPDF保存</button><button id="splitZip">全ページを個別PDFに分割（ZIP）</button></div></section><p class="status" id="status">PDFを選択してください。</p><section class="grid" id="grid"></section></main>
<script type="module">
import {PDFDocument,degrees} from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
const $=id=>document.getElementById(id),docs=new Map(),pages=[];let nextId=0,working=false;
const selected=()=>pages.filter(p=>p.selected);
function rangePages(){const raw=$('range').value.trim();if(!raw)throw Error('ページ範囲を入力してください');const result=[],seen=new Set();for(const token of raw.split(',')){const match=/^(\\d+)(?:\\s*-\\s*(\\d+))?$/.exec(token.trim());if(!match)throw Error('ページ範囲の書式が正しくありません: '+token);const a=Number(match[1]),b=match[2]?Number(match[2]):a;if(a<1||b<a||b>pages.length)throw Error('範囲外のページがあります: '+token);for(let n=a;n<=b;n++)if(!seen.has(n)){seen.add(n);result.push(pages[n-1])}}return result}
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}

function setBusy(v){working=v;document.querySelectorAll('button,input').forEach(x=>x.disabled=v)}
function draw(){const grid=$('grid');grid.replaceChildren();$('status').textContent=pages.length+' ページ / '+selected().length+' ページ選択中';pages.forEach((p,i)=>{const box=document.createElement('article');box.className='page'+(p.selected?' selected':'');const canvas=document.createElement('canvas'),title=document.createElement('strong'),meta=document.createElement('small'),pick=document.createElement('label'),check=document.createElement('input'),actions=document.createElement('div');title.textContent='ページ '+(i+1);meta.textContent=p.name+' / '+(p.index+1)+'ページ';pick.className='pick';check.type='checkbox';check.checked=p.selected;check.onchange=()=>{p.selected=check.checked;draw()};pick.append(check,' 選択');actions.className='actions';for(const [label,delta] of [['←',-1],['→',1]]){const b=document.createElement('button');b.textContent=label;b.disabled=i+delta<0||i+delta>=pages.length;b.onclick=()=>{[pages[i],pages[i+delta]]=[pages[i+delta],pages[i]];draw()};actions.append(b)}box.append(canvas,title,meta,pick,actions);grid.append(box);docs.get(p.id).preview.getPage(p.index+1).then(page=>{if(!canvas.isConnected)return;const view=page.getViewport({scale:.4,rotation:(page.rotate+p.rotation)%360});canvas.width=view.width;canvas.height=view.height;return page.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise}).catch(()=>{meta.textContent+='（プレビュー不可）'})})}
$('files').onchange=async e=>{setBusy(true);try{for(const file of e.target.files){const data=new Uint8Array(await file.arrayBuffer());const doc=await PDFDocument.load(data);const preview=await pdfjs.getDocument({data:data.slice()}).promise;const id=++nextId;docs.set(id,{doc,preview});for(let i=0;i<doc.getPageCount();i++)pages.push({id,index:i,name:file.name,selected:false,rotation:0})}draw()}catch(err){alert('読み込みに失敗しました: '+err.message)}finally{e.target.value='';setBusy(false)}};
$('all').onclick=()=>{const v=!pages.every(p=>p.selected);pages.forEach(p=>p.selected=v);draw()};
$('rotate').onclick=()=>{selected().forEach(p=>p.rotation=(p.rotation+90)%360);draw()};
$('remove').onclick=()=>{for(let i=pages.length-1;i>=0;i--)if(pages[i].selected)pages.splice(i,1);draw()};
$('clear').onclick=()=>{if(pages.length&&!confirm('すべて削除しますか？'))return;pages.length=0;docs.clear();draw()};
async function exportPages(list,name){if(!list.length){alert('保存するページがありません');return}setBusy(true);try{const out=await PDFDocument.create();for(const p of list){const [copy]=await out.copyPages(docs.get(p.id).doc,[p.index]);copy.setRotation(degrees((copy.getRotation().angle+p.rotation)%360));out.addPage(copy)}const data=await out.save();saveBlob(new Blob([data],{type:'application/pdf'}),name)}catch(err){alert('保存に失敗しました: '+err.message)}finally{setBusy(false)}}
$('rangeSelect').onclick=()=>{try{const items=new Set(rangePages());pages.forEach(p=>p.selected=items.has(p));draw()}catch(err){alert(err.message)}};
$('rangeSave').onclick=()=>{try{exportPages(rangePages(),'pdf-toolbox-range.pdf')}catch(err){alert(err.message)}};
$('splitZip').onclick=async()=>{if(!pages.length){alert('PDFを読み込んでください');return}setBusy(true);$('status').textContent='ZIPを作成しています…';try{const {default:JSZip}=await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');const zip=new JSZip();for(let i=0;i<pages.length;i++){const p=pages[i],out=await PDFDocument.create(),[copy]=await out.copyPages(docs.get(p.id).doc,[p.index]);copy.setRotation(degrees((copy.getRotation().angle+p.rotation)%360));out.addPage(copy);zip.file('page-'+String(i+1).padStart(3,'0')+'.pdf',await out.save())}saveBlob(await zip.generateAsync({type:'blob'}),'pdf-toolbox-split.zip')}catch(err){alert('分割に失敗しました: '+err.message)}finally{setBusy(false);draw()}};
$('save').onclick=()=>exportPages(pages,'pdf-toolbox.pdf');$('extract').onclick=()=>exportPages(selected(),'pdf-toolbox-extracted.pdf');draw();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
